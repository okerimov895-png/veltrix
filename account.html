
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIX | Hesab</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #071225;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  width: 85%;
  max-width: 380px;
  padding: 28px;
  background: #101f38;
  border-radius: 16px;
}
h1 { color: #8da6ff; text-align: center; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 8px;
  border: 1px solid #344766;
}
input { background: #071225; color: white; }
button {
  background: #526dff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; }
.switch { text-align: center; margin-top: 18px; }
.switch a { color: #8da6ff; cursor: pointer; }
#message { text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>VELTRIX</h1>
  <h2 id="heading">Hesab yarat</h2>

  <div id="usernameBox">
    <input id="username" placeholder="İstifadəçi adı">
  </div>

  <input id="email" type="email" placeholder="E-poçt ünvanı">
  <input id="password" type="password" placeholder="VELTRIX şifrəsi">

  <button id="submitBtn" onclick="handleAuth()">Qeydiyyatdan keç</button>
  <p id="message"></p>

  <div class="switch">
    <span id="switchText">Artıq hesabın var?</span>
    <a onclick="toggleMode()" id="switchLink">Daxil ol</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yekcqqxgyrgreketnfez.supabase.co";
const SUPABASE_KEY = "sb_publishable_8PPe8UicBq0ekvmaCxG2BA_zdHX_vZL";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let isSignup = true;

function toggleMode() {
  isSignup = !isSignup;
  document.getElementById("heading").textContent =
    isSignup ? "Hesab yarat" : "Hesaba daxil ol";
  document.getElementById("usernameBox").style.display =
    isSignup ? "block" : "none";
  document.getElementById("submitBtn").textContent =
    isSignup ? "Qeydiyyatdan keç" : "Daxil ol";
  document.getElementById("switchText").textContent =
    isSignup ? "Artıq hesabın var?" : "Hesabın yoxdur?";
  document.getElementById("switchLink").textContent =
    isSignup ? "Daxil ol" : "Qeydiyyat";
  document.getElementById("message").textContent = "";
}

async function handleAuth() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("submitBtn");

  if (!email || !password || (isSignup && !username)) {
    message.textContent = "Bütün xanaları doldur.";
    return;
  }

  if (password.length < 8) {
    message.textContent = "Şifrə ən azı 8 simvol olmalıdır.";
    return;
  }

  button.disabled = true;
  message.textContent = "Gözlə...";

  try {
    if (isSignup) {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) throw error;

      message.textContent = data.session
        ? "Qeydiyyat uğurludur!"
        : "Təsdiq məktubu e-poçtuna göndərildi. E-poçtunu yoxla.";
    } else {
      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;
      message.textContent = "Uğurla daxil oldun!";
    }
  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
