
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIX | Hesab</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #071225;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  width: 85%;
  max-width: 380px;
  padding: 28px;
  background: #101f38;
  border-radius: 16px;
}
h1 { color: #8da6ff; text-align: center; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 8px;
  border: 1px solid #344766;
}
input { background: #071225; color: white; }
button {
  background: #526dff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; }
.switch { text-align: center; margin-top: 18px; }
.switch a { color: #8da6ff; cursor: pointer; }
#message { text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>VELTRIX</h1>
  <h2 id="heading">Hesab yarat</h2>

  <div id="usernameBox">
    <input id="username" placeholder="İstifadəçi adı">
  </div>

  <input id="email" type="email" placeholder="E-poçt ünvanı">
  <input id="password" type="password" placeholder="VELTRIX şifrəsi">

  <button id="submitBtn" onclick="handleAuth()">Qeydiyyatdan keç</button>
  <p id="message"></p>
<div id="accountPanel" style="display:none; text-align:center;">
  <h2 id="welcome"></h2>
  <p>VELTRIX hesabına xoş gəlmisən!</p>
  <button onclick="logout()">Hesabdan çıxış</button>
</div>
  <div class="switch">
    <span id="switchText">Artıq hesabın var?</span>
    <a onclick="toggleMode()" id="switchLink">Daxil ol</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  
const SUPABASE_URL = "https://yekcqqxgyrgreketnfez.supabase.co";
const SUPABASE_KEY = "BURAYA_YENI_PUBLISHABLE_KEY";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let isSignup = true;

function renderAccount(session) {
  const loggedIn = !!session;

  document.getElementById("accountPanel").style.display =
    loggedIn ? "block" : "none";

  document.getElementById("usernameBox").style.display =
    loggedIn || !isSignup ? "none" : "block";

  document.getElementById("email").style.display =
    loggedIn ? "none" : "block";

  document.getElementById("password").style.display =
    loggedIn ? "none" : "block";

  document.getElementById("submitBtn").style.display =
    loggedIn ? "none" : "block";

  document.querySelector(".switch").style.display =
    loggedIn ? "none" : "block";

  if (loggedIn) {
    const user = session.user;
    const name = user.user_metadata?.username || user.email;
    document.getElementById("welcome").textContent =
      "Salam, " + name + "!";
  }
}

function toggleMode() {
  isSignup = !isSignup;

  document.getElementById("heading").textContent =
    isSignup ? "Hesab yarat" : "Hesaba daxil ol";

  document.getElementById("usernameBox").style.display =
    isSignup ? "block" : "none";

  document.getElementById("submitBtn").textContent =
    isSignup ? "Qeydiyyatdan keç" : "Daxil ol";

  document.getElementById("switchText").textContent =
    isSignup ? "Artıq hesabın var?" : "Hesabın yoxdur?";

  document.getElementById("switchLink").textContent =
    isSignup ? "Daxil ol" : "Qeydiyyat";

  document.getElementById("message").textContent = "";
}

async function handleAuth() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value.trim();
  const message = document.getElementById("message");

  if (!email || !password || (isSignup && !username)) {
    message.textContent = "Bütün xanaları doldur.";
    return;
  }

  if (password.length < 8) {
    message.textContent = "Şifrə ən azı 8 simvol olmalıdır.";
    return;
  }

  try {
    document.getElementById("submitBtn").disabled = true;
    message.textContent = "Gözlə...";

    if (isSignup) {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) throw error;

      if (data.session) {
        renderAccount(data.session);
        message.textContent = "Qeydiyyat uğurludur!";
      } else {
        message.textContent =
          "Təsdiq məktubu göndərildi. E-poçtunu yoxla.";
      }
    } else {
      const { data, error } =
        await client.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      renderAccount(data.session);
      message.textContent = "Uğurla daxil oldun!";
    }
  } catch (error) {
    message.textContent = error.message;
  } finally {
    document.getElementById("submitBtn").disabled = false;
  }
}

async function logout() {
  const { error } = await client.auth.signOut();

  if (error) {
    document.getElementById("message").textContent = error.message;
    return;
  }

  isSignup = false;
  document.getElementById("heading").textContent = "Hesaba daxil ol";
  document.getElementById("message").textContent = "Hesabdan çıxdın.";
  renderAccount(null);
}

client.auth.onAuthStateChange((_event, session) => {
  renderAccount(session);
});

client.auth.getSession().then(({ data }) => {
  renderAccount(data.session);
});

</script>
</body>
</html>
