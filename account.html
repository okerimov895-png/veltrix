
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIX | Account</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #071225;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
  padding: 28px;
  background: #101f38;
  border: 1px solid #263b5e;
  border-radius: 18px;
}

h1 {
  text-align: center;
  color: #8da6ff;
  letter-spacing: 3px;
}

h2 { text-align: center; }

input {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #344766;
  border-radius: 9px;
  background: #071225;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #526dff;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled { opacity: .6; }

.switch {
  text-align: center;
  margin-top: 20px;
}

a {
  color: #8da6ff;
  cursor: pointer;
}

#message {
  text-align: center;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}

#accountPanel {
  display: none;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>VELTRIX</h1>

<div id="authPanel">
  <h2 id="heading">Hesab yarat</h2>

  <input id="username" placeholder="İstifadəçi adı">

  <input id="email" type="email"
         placeholder="E-poçt ünvanı">

  <input id="password" type="password"
         placeholder="VELTRIX şifrəsi">

  <button id="submitBtn" type="button"
          onclick="handleAuth()">
    Qeydiyyatdan keç
  </button>

  <p id="message"></p>

  <div class="switch">
    <span id="switchText">Artıq hesabın var?</span>
    <a onclick="toggleMode()" id="switchLink">Daxil ol</a>
  </div>
</div>

<div id="accountPanel">
  <h2 id="welcome"></h2>
  <p>VELTRIX hesabına xoş gəlmisən!</p>
  <button onclick="logout()">Hesabdan çıxış</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://yekcqqxgyrgreketnfez.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlla2NxcXhneXJncmVrZXRuZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MjU3NzcsImV4cCI6MjExMDQwMTc3N30.OKTxQ7EDSMrB6KcHNJ0hi-4P5GSWgOKsg7ZO_LPhseM";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let isSignup = true;

function showMessage(text) {
  document.getElementById("message").textContent = text;
}

function toggleMode() {
  isSignup = !isSignup;

  document.getElementById("heading").textContent =
    isSignup ? "Hesab yarat" : "Hesaba daxil ol";

  document.getElementById("username").style.display =
    isSignup ? "block" : "none";

  document.getElementById("submitBtn").textContent =
    isSignup ? "Qeydiyyatdan keç" : "Daxil ol";

  document.getElementById("switchText").textContent =
    isSignup ? "Artıq hesabın var?" : "Hesabın yoxdur?";

  document.getElementById("switchLink").textContent =
    isSignup ? "Daxil ol" : "Qeydiyyat";

  showMessage("");
}

async function handleAuth() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value.trim();
  const button = document.getElementById("submitBtn");

  if (!email || !password || (isSignup && !username)) {
    showMessage("Bütün xanaları doldur.");
    return;
  }

  if (password.length < 8) {
    showMessage("Şifrə ən azı 8 simvol olmalıdır.");
    return;
  }

  button.disabled = true;
  showMessage("Yoxlanılır...");

  try {
    if (isSignup) {
      const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
        options: {
  data: { username: username },
  emailRedirectTo: "https://okerimov895-png.github.io/veltrix/"
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage("Qeydiyyat uğurludur!");
      } else {
        showMessage(
          "Təsdiq məktubu göndərildi. E-poçtunu yoxla."
        );
      }

    } else {
      const { error } = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      showMessage("Giriş uğurludur!");
    }

  } catch (error) {
    showMessage("Xəta: " + error.message);
  } finally {
    button.disabled = false;
  }
}

function renderAccount(session) {
  const loggedIn = Boolean(session);

  document.getElementById("authPanel").style.display =
    loggedIn ? "none" : "block";

  document.getElementById("accountPanel").style.display =
    loggedIn ? "block" : "none";

  if (loggedIn) {
    const username =
      session.user.user_metadata?.username ||
      session.user.email;

    document.getElementById("welcome").textContent =
      "Salam, " + username + "!";
  }
}

async function logout() {
  const { error } = await client.auth.signOut();

  if (error) {
    showMessage(error.message);
    return;
  }

  isSignup = false;
  document.getElementById("heading").textContent =
    "Hesaba daxil ol";

  document.getElementById("username").style.display = "none";
  document.getElementById("submitBtn").textContent = "Daxil ol";
  document.getElementById("switchText").textContent =
    "Hesabın yoxdur?";
  document.getElementById("switchLink").textContent =
    "Qeydiyyat";

  showMessage("Hesabdan çıxış edildi.");
  renderAccount(null);
}

client.auth.onAuthStateChange((event, session) => {
  renderAccount(session);
});

client.auth.getSession().then(({ data, error }) => {
  if (error) {
    showMessage(error.message);
    return;
  }

  renderAccount(data.session);
});
</script>

</body>
</html>
