
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTRIX | Hesab</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 background:linear-gradient(135deg,#071326,#102c50);
 color:white;font-family:Arial,sans-serif
}
.container{
 width:100%;max-width:410px;background:#10213a;
 padding:30px;border-radius:18px;
 border:1px solid #29496e;box-shadow:0 15px 45px #0005
}
.logo{text-align:center;font-size:30px;font-weight:bold;letter-spacing:4px}
.sub{text-align:center;color:#9db5d2;margin:10px 0 25px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{
 flex:1;padding:12px;border:0;border-radius:9px;
 background:#203b5c;color:white;font-weight:bold
}
.tabs button.active{background:#2678e8}
input{
 width:100%;padding:14px;margin:8px 0 14px;
 border-radius:9px;border:1px solid #355477;
 background:#09182b;color:white;font-size:15px
}
label{font-size:14px;color:#c4d5e8}
.action{
 width:100%;padding:14px;border:0;border-radius:9px;
 background:#2678e8;color:white;font-size:16px;font-weight:bold;
 margin-top:8px
}
.note{font-size:12px;color:#9db5d2;text-align:center;line-height:1.6;margin-top:20px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
 <div class="logo">VELTRIX</div>
 <div class="sub">Your Digital World</div>

 <div class="tabs">
  <button id="loginTab" class="active" onclick="showLogin()">Daxil ol</button>
  <button id="signupTab" onclick="showSignup()">Qeydiyyat</button>
 </div>

 <div id="login">
  <h2>Yenidən xoş gəldin!</h2>
  <label>E-poçt və ya istifadəçi adı</label>
  <input type="text" placeholder="E-poçt ünvanı">
  <label>VELTRIX şifrəsi</label>
  <input type="password" placeholder="Şifrən">
  <button class="action" onclick="demo()">Daxil ol</button>
 </div>

 <div id="signup" class="hidden">
  <h2>Yeni hesab yarat</h2>
  <label>İstifadəçi adı</label>
  <input type="text" placeholder="Məsələn: User123">
  <label>Gmail ünvanı</label>
  <input type="email" placeholder="example@gmail.com">
  <label>VELTRIX üçün yeni şifrə</label>
  <input type="password" placeholder="Yeni şifrə">
  <button class="action" onclick="demo()">Hesab yarat</button>
 </div>

 <div class="note">
  Bu, ilkin dizayn nümunəsidir. Hesab yaratma və giriş sistemi hələ qoşulmayıb.
 </div>
</div>

<script>
function showLogin(){
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("signup").classList.add("hidden");
 document.getElementById("loginTab").classList.add("active");
 document.getElementById("signupTab").classList.remove("active");
}
function showSignup(){
 document.getElementById("signup").classList.remove("hidden");
 document.getElementById("login").classList.add("hidden");
 document.getElementById("signupTab").classList.add("active");
 document.getElementById("loginTab").classList.remove("active");
}
function demo(){
 alert("VELTRIX hesab sistemi hələ aktiv deyil. Tezliklə qoşulacaq!");
}
</script>
</body>
</html>
